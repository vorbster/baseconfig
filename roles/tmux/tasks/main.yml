---

- name: Create tmux plugins dir
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.tmux/plugins"
    state: directory
    mode: "0755"

- name: Clone tmux plugins git repositories
  ansible.builtin.git:
    repo: "{{ item }}"
    # yamllint disable rule:line-length
    dest: "{{ ansible_user_dir }}/.tmux/plugins/{{ item | basename | split('.') | first }}"
    force: true
    version: "master"
  loop: "{{ tmux_git_repos }}"
