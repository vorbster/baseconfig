- name: Create config directory
  ansible.builtin.file:
    path: "~/.config"
    state: directory
    owner: "{{ my_user }}"
    group: "{{ my_group }}"
    mode: "0700"

- name: Sync neovim configs from dotfiles
  ansible.builtin.command: "rsync -avu --delete /tmp/dotfiles/nvim ~/.config"
  changed_when: false
