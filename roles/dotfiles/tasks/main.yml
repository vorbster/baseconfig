---

- name: Download dotfiles
  ansible.builtin.git:
    repo: "git@gitlab.com:vorbster/dotfiles.git"
    dest: "{{ ansible_user_dir }}/dotfiles"
    force: true
    version: main

- name: Stow adopt
  ansible.builtin.command: "stow --adopt ."
  args:
    chdir: "{{ ansible_user_dir }}/dotfiles"
  environment:
    PATH: "/opt/local/bin:{{ lookup ('env', 'PATH') }}"
  changed_when: false

- name: Restore dotfiles git
  ansible.builtin.command: "git restore ."
  args:
    chdir: "{{ ansible_user_dir }}/dotfiles"
  changed_when: false
