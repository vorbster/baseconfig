---
- name: Sync config files for alacritty
  ansible.builtin.copy:
    src: "/tmp/dotfiles/alacritty"
    dest: "~/.config/"
    remote_src: true

- name: Create directory for configs
  ansible.builtin.file:
    name: "~/.config/alacritty"
    state: directory
    owner: "{{ MY_USER }}"
    group: "{{ MY_GROUP }}"
    recurse: true
