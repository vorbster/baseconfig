---

- name: Download Homebrew installation script
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh"
    dest: /tmp/install.sh
    mode: "0777"

- name: Install Homebrew
  ansible.builtin.command: /tmp/install.sh
  environment:
    NONINTERACTIVE: "1"
  changed_when: true

- name: Tap into homebrew repos on Mac
  community.general.homebrew_tap:
   name: "{{ item }}"
  with_items: "{{ homebrew_tap_mac }}"

- name: Tap into homebrew repos on Linux
  community.general.homebrew_tap:
   name: "{{ item }}"
  with_items: "{{ homebrew_tap_linux }}"

- name: Install Homebrew packages for Linux
  community.general.homebrew:
    name: "{{ item }}"
    state: latest
  with_items: "{{ homebrew_packages + homebrew_packages_linux }}"
  when: ansible_system == "Linux"

- name: Install Homebrew packages for Mac
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  with_items: "{{ homebrew_packages + homebrew_packages_mac }}"
  when: ansible_system == "Darwin"
  environment:
   HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

- name: Install Homebrew casks for Linux
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: latest
    path: "/home/linuxbrew/.linuxbrew/bin"
  with_items: "{{ homebrew_casks + homebrew_casks_linux }}"
  when: ansible_system == "Linux"

- name: Install Homebrew casks for Mac
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: latest
  with_items: "{{ homebrew_casks + homebrew_casks_mac }}"
  when: ansible_system == "Darwin"

# Make sure all apps compiled with homebrew are using the system timezone

- name: Link homebrew localtime to the system one
  ansible.builtin.file:
    src: /etc/localtime
    dest: /home/linuxbrew/.linuxbrew/etc/localtime
    state: link
  when: ansible_system == "Linux"
