---

- name: Create mc skins directory
  ansible.builtin.file:
   path: "{{ ansible_user_dir }}/.local/share/mc/skins"
   state: directory
   mode: "0755"

- name: Create mc config directory
  ansible.builtin.file:
   path: "{{ ansible_user_dir }}/.config/mc/"
   state: directory
   mode: "0755"

- name: Download mashdark skin
  ansible.builtin.get_url:
   url: "https://raw.githubusercontent.com/notnout/mashdark/master/mashdark.ini"
   dest: "{{ ansible_user_dir }}/.local/share/mc/skins/mashdark.ini"
   mode: "0644"

- name: Download highlight config file
  ansible.builtin.get_url:
   # yamllint disable rule:line-length
   url: "https://raw.githubusercontent.com/notnout/mashdark/master/filehighlight.ini"
   dest: "{{ ansible_user_dir }}/.config/mc/filehighlight.ini"
   mode: "0644"

- name: Install config file
  ansible.builtin.copy:
   src: "/tmp/dotfiles/mc.ini"
   dest: "{{ ansible_user_dir }}/.config/mc/ini"
   mode: "0644"
